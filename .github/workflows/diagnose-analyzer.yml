name: diagnose analyzer

# Temporary. Isolates whether the NullReferenceException on windows-latest comes
# from module auto-loading picking the image's Windows PowerShell copy of
# PSScriptAnalyzer instead of the PowerShell 7 one that Install-Module adds.
on:
  push:
    branches: [fix/windows-analyzer]
  workflow_dispatch:

jobs:
  autoload:
    name: Auto-loaded, no Import-Module (what the first push did)
    runs-on: windows-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Force
      - shell: pwsh
        run: |
          "modules loaded before the call:"
          Get-Module PSScriptAnalyzer | Select-Object Version, ModuleBase | Format-Table -AutoSize
          $findings = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          "auto-load resolved to:"
          Get-Module PSScriptAnalyzer | Select-Object Version, ModuleBase | Format-Table -AutoSize
          "findings: $(@($findings).Count)"

  explicit:
    name: Explicit Import-Module first
    runs-on: windows-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Force
      - shell: pwsh
        run: |
          Import-Module PSScriptAnalyzer
          "import resolved to:"
          Get-Module PSScriptAnalyzer | Select-Object Version, ModuleBase | Format-Table -AutoSize
          $findings = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          "findings: $(@($findings).Count)"
