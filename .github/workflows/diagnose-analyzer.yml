name: diagnose analyzer

# Temporary. The crash did not reproduce in three attempts, so this measures how
# often it happens rather than assuming a deterministic cause: the exact failing
# invocation, in a fresh process, twenty times, on both platforms.
on:
  push:
    branches: [fix/windows-analyzer]
  workflow_dispatch:

jobs:
  repeat:
    name: Twenty runs on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Force

      - name: Repeat the exact failing invocation in fresh processes
        shell: pwsh
        run: |
          $probe = @(
              '$ErrorActionPreference = ''Stop'''
              'try {'
              '    $f = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1 -ErrorAction Stop'
              '    "OK " + @($f).Count'
              '}'
              'catch { "FAIL " + $_.Exception.Message }'
          )
          Set-Content -LiteralPath ./probe.ps1 -Value $probe
          $failures = 0
          foreach ($i in 1..20) {
              $out = (pwsh -NoProfile -File ./probe.ps1) -join ' '
              if ($out -like 'FAIL*') {
                  $failures++
                  "  run $i : $out"
              }
          }
          Remove-Item -LiteralPath ./probe.ps1
          "$failures failure(s) in 20 runs"
          if ($failures) { 'REPRODUCED' } else { 'did not reproduce' }
